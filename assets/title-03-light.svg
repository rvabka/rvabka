<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="112" viewBox="0 0 1200 112" fill="none">
<style>
@font-face{font-family:'Fmonom';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Fserif';src:url(data:font/woff2;base64,) format('woff2');}
.r{animation:rise 1s cubic-bezier(.16,1,.3,1) both}.r2{animation-delay:.12s}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.ln{stroke-dasharray:70;stroke-dashoffset:70;animation:draw 1.2s .1s cubic-bezier(.16,1,.3,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}
</style>
<defs>
<linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
</defs>
<g class="r"><text x="2.0" y="70.0" font-family="Fmonom" font-size="15" fill="#0f766e" letter-spacing="1.5" >03</text></g>
<line class="ln" x1="34" y1="65" x2="104" y2="65" stroke="url(#lg)" stroke-width="1.5"/>
<g class="r r2"><text x="120.0" y="76.0" font-family="Fserif" font-size="56" fill="#0c0d12" letter-spacing="-0.5" >Toolbox</text></g>
<line x1="0" y1="111" x2="1200" y2="111" stroke="rgba(15,17,23,0.09)"/>
</svg>
